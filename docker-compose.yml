
services:
  postgres:
    image: postgres:17
    container_name: room-expenditure-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: roomadmin
      POSTGRES_PASSWORD: roompassword
      POSTGRES_DB: room_expenditure
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

